<!DOCTYPE html>

<head>
    <title>Eventos</title>
    <link rel="icon" href="img/favicon.ico">

<body>

<!--#region HEADER --> 
    <header style="display: flex; place-self: end;">
        <nav>
            <a href="index.html">HOME</a> |
            <a href="events.html">EVENTOS</a> |
            <a href="contact.html">CONTATO</a> |
            <a href="about.html">SOBRE</a> |
            <a href="login.html">ENTRAR</a>
        </nav>
    </header>

    <img src="https://github.com/DWBA4/dwba4_semana_imagens/blob/master/Logo.jpg?raw=true" alt="Logo" id="topo">
<!--#endregion-->

    <h1><b>Inscreva-se</b></h1>

    <form>

<!--#region EVENTO --> 
        <fieldset>
            <label for="evento">Evento:</label>
            <select name="evento" id="evento" required>
                <option value="null">-- Selecione --</option>
                <option value="semAsas">Voe sem asas</option>
                <option value="festaJunina">Festa Junina</option>
                <option value="techWeek">Semana de Tecnologia</option>
            </select>
        </fieldset>
<!--#endregion-->

<!--#region INFOS DE ACESSO --> 
        <fieldset>
            <legend>Informações de Acesso</legend>
            <br>
                <label for="input_user">Usuário</label>
                <input type="text" name="input_user" id="input_user" required>
            <br><br>
                <label for="input_password">Senha</label>
                <input type="password" name="input_password" id="input_password" required>
            <br><br>
                <label for="conf_password">Confirme a Senha</label>
                <input type="password" name="conf_password" id="conf_password" required>
            <br><br>
        </fieldset>
<!--#endregion-->

<!--#region INFOS PESSOAIS --> 
        <fieldset>
            <legend>Informações Pessoais</legend><br>
                <label for="input_nome">Nome Completo</label>
                <input type="text" name="input_nome" id="input_nome" required>
            <br><br>
                <label for="input_email">E-mail</label>
                <input type="email" name="input_email" id="input_email" required>
            <br><br>
                <label for="input_phone">Celular</label>
                <input type="tel" name="input_phone" id="input_phone" maxlength="11" placeholder="(99) 99999-9999" required>
            <br><br>

                <fieldset>
                    <legend>Sexo</legend>
                    <input type="radio" name="gender" id="masc" value="masc" required> Masculino
                    <input type="radio" name="gender" id="fem" value="fem" required> Feminino
                </fieldset>
            <br>
        
                <label for="input_birth">Data de Nascimento</label>
                <input type="date" name="input_birth" id="input_birth" required>
            <br><br>
                <label for="input_color">Cor Favorita</label>
                <input type="color" name="input_color" id="input_color" value="#000000" required>
            <br><br>
                <label for="input_github">Perfil no GitHub</label>
                <input type="text" name="input_github" id="input_github" required>
        </fieldset>
        <br>

        <button type="submit">Inscrever-se</button>
        <button type="reset">Limpar</button>
        <br><br>
<!--#endregion-->
    
    </form>

<!--#region FOOTER -->

        (011) 2504-0100</p>

<!--#endregion-->

</body>
</html>
