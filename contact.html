    <h1><b>Mande uma mensagem</b></h1>

    <form>
        <ul>
            <li>
                <label for="input_nome">Nome</label>
                <input type="text" name="input_nome" id="input_nome" required>
            </li>
            <li>
                <label for="input_email">E-Mail</label>
                <input type="email" name="input_email" id="input_email" required>
            </li>
            <li>
                <label for="input_phone">Telefone</label>
                <input type="tel" name="input_phone" id="input_phone" maxlength="11" placeholder="(99) 99999-9999">
            </li>
            <li>
                <label for="input_subject"></label>
            <select name="input_subject" id="input_subject" required>
                <option value="null">-- Selecione --</option>
                <option value="reclamacao">Reclamação</option>
                <option value="sugestao">Sugestão</option>
            </select>
            </li>
            <li>
                <label for="input_message">Mensagem</label>
                <textarea name="input_message" id="input_message" rows="3" required></textarea>
            </li>
            <li>
                <fieldset>
                    <legend>Opções de Resposta</legend>
                    <input type="checkbox" name="answer" id="email" value="email" required> E-mail
                    <input type="checkbox" name="answer" id="phone" value="phone" required> Telefone
                </fieldset>
            </li>
            <li><button type="submit">Enviar</button></li>
        </ul>
    </form>
